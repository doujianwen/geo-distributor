      <rect x="14" y="12" width="7" height="9" rx="1"></rect>
      <rect x="3" y="16" width="7" height="5" rx="1"></rect>
    </symbol>
    <symbol id="ic-box" viewBox="0 0 24 24">
      <path d="M21 8 12 3 3 8v8l9 5 9-5z"></path>

    </symbol>
    <symbol id="ic-link" viewBox="0 0 24 24">
      <path d="M10 13a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7L11 6"></path>
      <path d="M14 11a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 19.7L13 18"></path>

    <symbol id="ic-bolt" viewBox="0 0 24 24">

    <symbol id="ic-trend" viewBox="0 0 24 24">

  <div class="app">
    <aside class="sidebar">
      <div class="brand">

        <div>
          <div class="brand-title">GEO 内容增长</div>
          <div class="brand-sub">专业作业台 · 授权项目</div>
        </div>
      </div>
      <nav id="nav"></nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left" style="display:flex;align-items:center;gap:12px">
          <h1 id="view-title">概览</h1>
          <select id="product-switch" class="select" style="width:auto;max-width:320px"></select>
          <span id="ai-status" class="ai-chip mock" title="AI 生产模块状态">演示模式</span>
        </div>
        <div class="topbar-right">
          <span id="topbar-hint" class="muted"></span>
        </div>
      </header>
      <p id="operator-boundary" class="operator-boundary">原生作业流程 · 自动模型与实时外采未开放；引用检查属于传统记录，不替代质量复核后的测量。</p><main id="view" class="view"></main>
    </div>

  <div id="modal-root"></div>
  <script src="/ui/operator-assets/operator-frame.js"></script>
