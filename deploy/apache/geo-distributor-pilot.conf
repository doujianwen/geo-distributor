# ==========================================================================
# geo-distributor Apache Reverse Proxy — Stage-1 Commercial Pilot
#
# 角色：把对 WordPress 公开的 /geo-api/* 路径反代到仅本机可见的后端。
#
# 信任边界：
#   WordPress (PHP, 同机)  →  Apache :80  →  127.0.0.1:8765 (geo-distributor)
#   后端端口不对外监听，无需公网可达。
#
# 事实依据（Phase 0 盘点）：
#   - 本机无 nginx；Apache 2.4（XAMPP）已具备 mod_proxy
#   - 无公网域名 / 无可信 CA 证书 → 不启用 SSL，不伪造 HTTPS
#   - 本文件仅配置 HTTP 反代；HTTPS 属外部基础设施条件
# ==========================================================================

# -------------------------------------------------------------------------
# 安全响应头（API 不加载页面，CSP 可极严）
# -------------------------------------------------------------------------
<IfModule mod_headers.c>
    # 安全响应头由**应用层**设置（api/app.py::security_headers_middleware）。
    # 此处**不重复设置** —— Apache 的 `Header always set` 是**追加**语义，
    # 会与应用层的头叠加成 "nosniff, nosniff"。
    # 纵深防御≠ 重复声明。
    #
    # 反代层只负责清除「后端可能漏设」的实现指纹。
    Header always unset Server
    Header always unset X-Powered-By

    # 显式清除 API Key：确保它不会被任何后续日志/错误页回显。
    # （请求头本身不会出现在响应里，此处是纵深保险）
    Header always unset X-API-Key
</IfModule>

# -------------------------------------------------------------------------
# 请求体上限与超时（API 契约见 docs/PRODUCTION-DEPLOYMENT.md）
# -------------------------------------------------------------------------
LimitRequestBody 8388608
ProxyTimeout 120

# -------------------------------------------------------------------------
# 文档端点：应用层已默认 404，这里是纵深防御
# 即使应用层被误配置为开启，反代层也不放行
# -------------------------------------------------------------------------
<LocationMatch "^/geo-api/(docs|redoc|openapi\.json)">
    Require all denied
</LocationMatch>

# -------------------------------------------------------------------------
# geo-distributor API 反代
# -------------------------------------------------------------------------
<Location "/geo-api/">
# -------------------------------------------------------------------------
# geo-distributor API 反代
#
# 用 vhost 层的 ProxyPass（不带 Location），因为 Apache 禁止在
# <Location> 内写带 path 的 ProxyPass。
# /geo-api 前缀在目标端被剥离（ProxyPass .../ 末尾斜杠）。
# -------------------------------------------------------------------------
ProxyPass        /geo-api/ http://127.0.0.1:8765/ retry=0
ProxyPassReverse /geo-api/ http://127.0.0.1:8765/

# forwarded headers：覆盖而非追加
# 用 %{REMOTE_ADDR}s（服务端变量）而非 $http_x_forwarded_for（客户端可控）
RequestHeader set X-Real-IP "%{REMOTE_ADDR}s" env=REMOTE_ADDR
RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s" env=REMOTE_ADDR
RequestHeader set X-Forwarded-Proto "http"


# -------------------------------------------------------------------------
# 健康检查：公开最小状态，且不记访问日志（高频轮询会淹没日志）
# -------------------------------------------------------------------------
<Location "/geo-api-health">
    SetHandler proxy-server
    ProxyPassReverse http://127.0.0.1:8765/
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s" env=REMOTE_ADDR
</Location>
